stages:
  - dependencies
  - code quality
  - tests
  - assets
  - deploy

default:
  image: ${CI_REGISTRY}/choosik/symfony/project-tools/docker-images:8.5
  interruptible: true

services:
  - name: mariadb:11
    alias: mysql

variables:
  MARIADB_DATABASE: app_test
  MARIADB_ROOT_PASSWORD: root
  TZ: Europe/Paris
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.yarn-cache"

# ─── Stage: dependencies ────────────────────────────────────────────────────

composer:
  stage: dependencies
  script:
    - composer validate --strict 2>&1 | grep -v 'The version field is present' || true
    - composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
  cache:
    key:
      files:
        - composer.lock
    fallback_keys:
      - composer-fallback
    paths:
      - vendor/
      - .composer-cache/
  artifacts:
    paths:
      - vendor
      - var/cache
    expire_in: 1 hour

yarn:
  stage: dependencies
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - yarn install --frozen-lockfile
    - yarn audit --level moderate || true
  cache:
    key:
      files:
        - yarn.lock
    fallback_keys:
      - yarn-fallback
    paths:
      - node_modules/
      - .yarn-cache/
  artifacts:
    paths:
      - node_modules
    expire_in: 1 hour

# ─── Stage: code quality ────────────────────────────────────────────────────

.composer-job: &composer-job
  needs:
    - job: composer
      artifacts: true

ecs:
  <<: *composer-job
  stage: code quality
  script: php vendor/bin/ecs check src

lint:container:
  <<: *composer-job
  stage: code quality
  script: php bin/console lint:container

lint:translations:
  <<: *composer-job
  stage: code quality
  script: php bin/console lint:translations

lint:twig:
  <<: *composer-job
  stage: code quality
  script: php bin/console lint:twig templates/

lint:yaml:
  <<: *composer-job
  stage: code quality
  script: php bin/console lint:yaml config

# ─── Stage: tests ───────────────────────────────────────────────────────────

phpunit:
  <<: *composer-job
  stage: tests
  variables:
    DATABASE_URL: "mysql://root:$MARIADB_ROOT_PASSWORD@mysql:3306/$MARIADB_DATABASE?serverVersion=mariadb-11&charset=utf8mb4"
  script:
    - sed -i '/DATABASE_URL/d' .env.test
    - echo "DATABASE_URL=\"${DATABASE_URL}\"" >> .env.test
    - APP_ENV=test php bin/console doctrine:database:create --if-not-exists
    - APP_ENV=test php bin/console doctrine:migrations:migrate --no-interaction
    - APP_ENV=test php vendor/bin/phpunit

# ─── Stage: assets ──────────────────────────────────────────────────────────

assets:
  stage: assets
  image: node:22-alpine
  needs:
    - job: yarn
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - corepack enable
  script:
    - yarn build
  artifacts:
    paths:
      - public/build
    expire_in: 1 day

# ─── Stage: deploy ──────────────────────────────────────────────────────────

.deploy: &deploy
  stage: deploy
  cache:
    paths:
      - deployer/vendor
      - deployer/bin
  before_script:
    - cd ./deployer
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
    - cd ..
    - which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
    - mkdir -p ~/.ssh
    # Host key verification: use SSH_KNOWN_HOSTS if provided, else fall back to disabling the check
    - if [ -n "$SSH_KNOWN_HOSTS" ]; then echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 644 ~/.ssh/known_hosts; else echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config; fi
    - eval $(ssh-agent -s)
    # Key to log into the deploy server
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    # Deploy key forwarded to the server so Deployer can clone the repo from GitLab (forward_agent=true)
    - if [ -n "$GITLAB_AGENTSSH_ED25519" ]; then ssh-add <(echo "$GITLAB_AGENTSSH_ED25519"); fi

# Shared deploy dependencies — single source of truth for staging & prod
.deploy-needs: &deploy-needs
  needs:
    - job: composer
      artifacts: true
    - job: ecs
    - job: lint:container
    - job: lint:translations
    - job: lint:twig
    - job: lint:yaml
    - job: phpunit
    - job: assets
      artifacts: true

deploy:staging:
  <<: [*deploy, *deploy-needs]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - deployer/bin/dep deploy staging -v
  environment:
    name: staging

deploy:prod:
  <<: [*deploy, *deploy-needs]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - deployer/bin/dep deploy prod -v
  environment:
    name: prod
